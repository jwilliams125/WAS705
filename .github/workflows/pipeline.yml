name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:

  security-scans:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (Gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git -v || true

      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep \
            --config p/default --config p/security-audit --config p/dockerfile /src || true

      - name: SAST (Bandit on Python)
        run: |
          python3 -m venv /tmp/scanenv
          /tmp/scanenv/bin/pip install --quiet bandit
          /tmp/scanenv/bin/bandit -r scripts/ -f txt || true

      - name: IaC scan (Checkov)
        run: |
          python3 -m venv /tmp/checkovenv
          /tmp/checkovenv/bin/pip install --quiet checkov
          /tmp/checkovenv/bin/checkov -d terraform/ --soft-fail

      - name: IaC scan (tfsec)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/tfsec /src/terraform --soft-fail

  deploy:
    runs-on: self-hosted
    needs: security-scans
    env:
      TF_VAR_db_password: ${{ secrets.PENPOT_DB_PASSWORD }}
      TF_VAR_secret_key: ${{ secrets.PENPOT_SECRET_KEY }}
      TF_VAR_public_host: ${{ vars.PUBLIC_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Ansible host prep and hardening
        working-directory: ansible
        run: |
          ansible-playbook playbook.yml -e public_host="${{ vars.PUBLIC_HOST }}"

      - name: Terraform deploy Penpot stack
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false

  image-scan:
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Trivy on Penpot backend image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity HIGH,CRITICAL \
            penpotapp/backend:2.4.3 || true

  dast-validate:
    runs-on: self-hosted
    needs: image-scan
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Penpot to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sk https://${{ vars.PUBLIC_HOST }}/ >/dev/null && break
            sleep 5
          done

      - name: DAST (OWASP ZAP baseline)
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://${{ vars.PUBLIC_HOST }} -I -r zap-report.html || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html

      - name: Post deployment validation
        run: |
          chmod +x scripts/validate.sh
          bash scripts/validate.sh "${{ vars.PUBLIC_HOST }}"

  notify:
    runs-on: self-hosted
    needs: [dast-validate]
    if: always()
    steps:
      - name: Open issue if a stage failed
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline finding on run ${context.runId}`,
              body: `A scan, deploy, or validation stage reported a problem. Check the workflow artifacts (ZAP, Trivy) and logs.`,
              labels: ['security', 'automated']
            })

      - name: Send webhook
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"content\":\"Penpot pipeline run ${{ github.run_id }} finished: ${{ job.status }}\"}" \
            "${{ secrets.NOTIFY_WEBHOOK }}" || true
